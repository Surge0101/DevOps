<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="1020" fill="#F8F9FA"/>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F4E79">bg-app AWS Architecture — dev environment (ap-southeast-2)</text>
  <text x="600" y="52" text-anchor="middle" font-size="11" fill="#888">Generated from CDK source — NetworkStack / RDSStack / ECSStack</text>

  <!-- ── INTERNET ──────────────────────────────────────────────── -->
  <rect x="490" y="68" width="220" height="46" rx="10" fill="#E8E8E8" stroke="#888" stroke-width="1.5"/>
  <text x="600" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Internet</text>
  <text x="600" y="104" text-anchor="middle" font-size="11" fill="#666">User traffic</text>

  <!-- Arrow: Internet → ALB -->
  <line x1="600" y1="114" x2="600" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="612" y="137" font-size="10" fill="#555">HTTP :80</text>

  <!-- ── NO DNS / NO ACM NOTICE ──────────────────────────────── -->
  <rect x="860" y="75" width="230" height="40" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="975" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#BF360C">No Route 53 / ACM</text>
  <text x="975" y="108" text-anchor="middle" font-size="10" fill="#E65100">HTTP only — HTTPS not yet wired</text>

  <!-- ── VPC OUTER CONTAINER ──────────────────────────────────── -->
  <rect x="60" y="150" width="830" height="680" rx="18" fill="none" stroke="#2E75B6" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="80" y="172" font-size="12" font-weight="bold" fill="#2E75B6">dev VPC  10.1.0.0/16  |  ap-southeast-2  |  maxAzs: 1  |  Account: 611411463255</text>

  <!-- ── PUBLIC SUBNET ───────────────────────────────────────── -->
  <rect x="80" y="178" width="790" height="145" rx="12" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="100" y="197" font-size="11" font-weight="bold" fill="#2E7D32">Public Subnet  (10.1.0.0/24 - AZ-a only)</text>

  <!-- ALB -->
  <rect x="100" y="206" width="300" height="100" rx="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5"/>
  <text x="250" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">Application Load Balancer</text>
  <text x="250" y="244" text-anchor="middle" font-size="11" fill="#1565C0">dev-alb</text>
  <text x="250" y="262" text-anchor="middle" font-size="11" fill="#1565C0">HTTP :80 → forward (no redirect)</text>
  <text x="250" y="278" text-anchor="middle" font-size="10" fill="#1976D2">Security Group: dev-alb-sg  |  0.0.0.0/0:80,443</text>
  <text x="250" y="293" text-anchor="middle" font-size="10" fill="#1976D2">Internet-facing  |  Public subnet</text>

  <!-- Internet Gateway -->
  <rect x="460" y="206" width="380" height="100" rx="10" fill="#C8E6C9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="650" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">Internet Gateway</text>
  <text x="650" y="246" text-anchor="middle" font-size="11" fill="#388E3C">Attached to VPC  |  Route: 0.0.0.0/0 → IGW</text>

  <!-- NO NAT NOTICE -->
  <rect x="460" y="258" width="380" height="40" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="650" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#BF360C">No NAT Gateway  (natGateways: 0)</text>
  <text x="650" y="291" text-anchor="middle" font-size="10" fill="#E65100">ECS private subnet has no outbound internet route</text>

  <!-- Arrow: ALB → ECS -->
  <line x1="250" y1="306" x2="250" y2="375" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="260" y="344" font-size="10" fill="#1565C0">:8080</text>

  <!-- ── PRIVATE APP SUBNET ───────────────────────────────────── -->
  <rect x="80" y="375" width="790" height="215" rx="12" fill="#FFF3E0" stroke="#E65100" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="100" y="394" font-size="11" font-weight="bold" fill="#BF360C">PrivateApp Subnet  (10.1.2.0/24 - AZ-a)  PRIVATE_WITH_EGRESS — no NAT route active</text>

  <!-- ECS Cluster box -->
  <rect x="100" y="402" width="480" height="172" rx="10" fill="#FFE0B2" stroke="#E65100" stroke-width="1.5"/>
  <text x="340" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">ECS Fargate Cluster</text>
  <text x="340" y="440" text-anchor="middle" font-size="11" fill="#E65100">dev-cluster  |  Container Insights: OFF</text>

  <!-- Fargate Task -->
  <rect x="118" y="450" width="444" height="110" rx="8" fill="#FFCC80" stroke="#F57C00" stroke-width="1.2"/>
  <text x="340" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Fargate Task  (dev-spring-app service)</text>
  <text x="340" y="489" text-anchor="middle" font-size="11" fill="#F57C00">Spring Boot  |  Port 8080  |  Image: dev-spring-app:latest (ECR)</text>
  <text x="340" y="507" text-anchor="middle" font-size="10" fill="#F57C00">CPU: 512  |  Memory: 1024 MB  |  desiredCount: 1</text>
  <text x="340" y="524" text-anchor="middle" font-size="10" fill="#F57C00">Security Group: dev-ecs-sg  |  assignPublicIp: false</text>
  <text x="340" y="541" text-anchor="middle" font-size="10" fill="#F57C00">Env: SPRING_DATASOURCE_URL  |  Secrets: username / password</text>
  <text x="340" y="556" text-anchor="middle" font-size="10" fill="#F57C00">Health: GET /health  |  startPeriod: 60s  |  LogGroup: /dev/ecs/spring-app (7d)</text>

  <!-- VPC Endpoints panel -->
  <rect x="600" y="402" width="260" height="172" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="730" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">VPC Endpoints</text>

  <!-- S3 Gateway (active) -->
  <rect x="618" y="432" width="224" height="38" rx="6" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="730" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">S3 Gateway  ✓ active</text>
  <text x="730" y="464" text-anchor="middle" font-size="10" fill="#2E7D32">ECR image layers (free, no NAT needed)</text>

  <!-- Interface endpoints (commented out) -->
  <rect x="618" y="478" width="224" height="88" rx="6" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="730" y="496" text-anchor="middle" font-size="11" font-weight="bold" fill="#9E9E9E">Interface Endpoints</text>
  <text x="730" y="514" text-anchor="middle" font-size="10" fill="#BDBDBD">COMMENTED OUT in code</text>
  <text x="730" y="530" text-anchor="middle" font-size="10" fill="#BDBDBD">SSM / SSM-Messages / EC2-Messages</text>
  <text x="730" y="546" text-anchor="middle" font-size="10" fill="#BDBDBD">CloudWatch Logs / KMS / Secrets Mgr</text>
  <text x="730" y="562" text-anchor="middle" font-size="10" fill="#BDBDBD">ECR API / ECR Docker</text>

  <!-- Arrow: ECS → RDS -->
  <line x1="250" y1="574" x2="250" y2="638" stroke="#E65100" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="260" y="609" font-size="10" fill="#E65100">:5432</text>

  <!-- ── PRIVATE DATA SUBNET ──────────────────────────────────── -->
  <rect x="80" y="610" width="790" height="200" rx="12" fill="#FCE4EC" stroke="#880E4F" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="100" y="630" font-size="11" font-weight="bold" fill="#880E4F">PrivateData Subnet  (10.1.4.0/24 - AZ-a)  PRIVATE_ISOLATED — no internet route</text>

  <!-- RDS -->
  <rect x="100" y="640" width="330" height="150" rx="10" fill="#F8BBD0" stroke="#C2185B" stroke-width="1.5"/>
  <text x="265" y="661" text-anchor="middle" font-size="13" font-weight="bold" fill="#880E4F">RDS PostgreSQL</text>
  <text x="265" y="679" text-anchor="middle" font-size="11" fill="#C2185B">dev-Postgres  (appdb)</text>
  <text x="265" y="697" text-anchor="middle" font-size="11" fill="#C2185B">PostgreSQL 16  |  db.t4g.micro</text>
  <text x="265" y="713" text-anchor="middle" font-size="10" fill="#AD1457">Multi-AZ: false  |  Storage: 100 GB GP3</text>
  <text x="265" y="729" text-anchor="middle" font-size="10" fill="#AD1457">Backup retention: 1 day  |  publiclyAccessible: false</text>
  <text x="265" y="745" text-anchor="middle" font-size="10" fill="#AD1457">Security Group: dev-DbSg  |  Encrypted: KMS CMK</text>
  <text x="265" y="761" text-anchor="middle" font-size="10" fill="#AD1457">Creds: Secrets Manager  |  removalPolicy: DESTROY</text>
  <text x="265" y="778" text-anchor="middle" font-size="10" fill="#AD1457">deletionProtection: false</text>

  <!-- KMS Key -->
  <rect x="470" y="640" width="180" height="100" rx="10" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="1.2"/>
  <text x="560" y="661" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A148C">KMS CMK</text>
  <text x="560" y="679" text-anchor="middle" font-size="11" fill="#6A1B9A">dev-DbKey</text>
  <text x="560" y="697" text-anchor="middle" font-size="10" fill="#7B1FA2">Rotation: enabled</text>
  <text x="560" y="713" text-anchor="middle" font-size="10" fill="#7B1FA2">Encrypts RDS storage</text>
  <text x="560" y="729" text-anchor="middle" font-size="10" fill="#7B1FA2">removalPolicy from cfg</text>

  <!-- Secrets Manager -->
  <rect x="680" y="640" width="175" height="100" rx="10" fill="#D1C4E9" stroke="#4527A0" stroke-width="1.2"/>
  <text x="767" y="661" text-anchor="middle" font-size="12" font-weight="bold" fill="#311B92">Secrets Manager</text>
  <text x="767" y="679" text-anchor="middle" font-size="10" fill="#4527A0">/dev/rds/postgres/</text>
  <text x="767" y="695" text-anchor="middle" font-size="10" fill="#4527A0">credentials</text>
  <text x="767" y="711" text-anchor="middle" font-size="10" fill="#4527A0">username: postgres</text>
  <text x="767" y="727" text-anchor="middle" font-size="10" fill="#4527A0">password: auto-generated</text>

  <!-- ── SHARED VPC + TGW (side panel) ──────────────────────── -->
  <rect x="920" y="150" width="250" height="420" rx="14" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="940" y="170" font-size="11" font-weight="bold" fill="#6A1B9A">Shared VPC  10.0.0.0/16</text>
  <text x="940" y="186" font-size="10" fill="#9C27B0">Account: 084847996201</text>

  <rect x="935" y="195" width="220" height="80" rx="8" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="1.2"/>
  <text x="1045" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A148C">Transit Gateway</text>
  <text x="1045" y="233" text-anchor="middle" font-size="10" fill="#6A1B9A">Central-TGW</text>
  <text x="1045" y="249" text-anchor="middle" font-size="10" fill="#6A1B9A">autoAccept: enabled</text>
  <text x="1045" y="265" text-anchor="middle" font-size="10" fill="#6A1B9A">Default RT assoc + prop</text>

  <rect x="935" y="290" width="220" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="1045" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#4C1D95">RAM Share</text>
  <text x="1045" y="328" text-anchor="middle" font-size="10" fill="#6D28D9">Central-TGW-Share</text>
  <text x="1045" y="344" text-anchor="middle" font-size="10" fill="#6D28D9">Shared to Org</text>

  <rect x="935" y="365" width="220" height="80" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.2"/>
  <text x="1045" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A148C">Test EC2 Instance</text>
  <text x="1045" y="403" text-anchor="middle" font-size="10" fill="#6A1B9A">t4g.nano  |  AL2023 ARM64</text>
  <text x="1045" y="419" text-anchor="middle" font-size="10" fill="#6A1B9A">Isolated subnet  |  SSM access</text>
  <text x="1045" y="435" text-anchor="middle" font-size="10" fill="#6A1B9A">ncat listener for TGW tests</text>

  <!-- TGW config note -->
  <rect x="935" y="460" width="220" height="80" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="1045" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">Dev TGW Attachment</text>
  <text x="1045" y="498" text-anchor="middle" font-size="10" fill="#F57F17">COMMENTED OUT in code</text>
  <text x="1045" y="514" text-anchor="middle" font-size="10" fill="#F57F17">tgw-03bed3d5a309c899f</text>
  <text x="1045" y="530" text-anchor="middle" font-size="10" fill="#F57F17">Dev → Shared route disabled</text>

  <!-- ── NO CI/CD NOTICE ────────────────────────────────── -->
  <rect x="920" y="590" width="250" height="80" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1045" y="612" text-anchor="middle" font-size="12" font-weight="bold" fill="#BF360C">No CI/CD Pipeline</text>
  <text x="1045" y="630" text-anchor="middle" font-size="10" fill="#E65100">CodePipeline / CodeBuild /</text>
  <text x="1045" y="646" text-anchor="middle" font-size="10" fill="#E65100">ECS Deploy not in CDK stacks</text>
  <text x="1045" y="662" text-anchor="middle" font-size="10" fill="#E65100">Docker push to ECR is manual</text>

  <!-- ── IAM ROLES (side) ───────────────────────────────── -->
  <rect x="920" y="690" width="250" height="110" rx="10" fill="#E8EAF6" stroke="#3949AB" stroke-width="1.2"/>
  <text x="1045" y="710" text-anchor="middle" font-size="12" font-weight="bold" fill="#283593">IAM Roles</text>
  <text x="1045" y="728" text-anchor="middle" font-size="11" font-weight="bold" fill="#3949AB">TaskExecutionRole</text>
  <text x="1045" y="745" text-anchor="middle" font-size="10" fill="#3949AB">AmazonECSTaskExecutionRolePolicy</text>
  <text x="1045" y="761" text-anchor="middle" font-size="10" fill="#3949AB">+ secretsmanager:GetSecretValue</text>
  <text x="1045" y="779" text-anchor="middle" font-size="11" font-weight="bold" fill="#3949AB">TaskRole</text>
  <text x="1045" y="796" text-anchor="middle" font-size="10" fill="#3949AB">No extra permissions (app-level)</text>

  <!-- ── LEGEND ─────────────────────────────────────────────────── -->
  <rect x="60" y="840" width="830" height="75" rx="8" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1"/>
  <text x="80" y="858" font-size="11" font-weight="bold" fill="#333">Legend</text>
  <rect x="80" y="866" width="14" height="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="1"/>
  <text x="100" y="875" font-size="10" fill="#333">Networking / ALB</text>
  <rect x="220" y="866" width="14" height="10" fill="#FFE0B2" stroke="#E65100" stroke-width="1"/>
  <text x="240" y="875" font-size="10" fill="#333">Compute (ECS)</text>
  <rect x="340" y="866" width="14" height="10" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
  <text x="360" y="875" font-size="10" fill="#333">Database (RDS)</text>
  <rect x="460" y="866" width="14" height="10" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="1"/>
  <text x="480" y="875" font-size="10" fill="#333">Security (KMS / Secrets)</text>
  <rect x="630" y="866" width="14" height="10" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="650" y="875" font-size="10" fill="#333">VPC Endpoints</text>
  <rect x="750" y="866" width="14" height="10" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1"/>
  <text x="770" y="875" font-size="10" fill="#333">Shared / TGW</text>

  <line x1="80" y1="900" x2="110" y2="900" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="116" y="904" font-size="10" fill="#333">Dashed border = commented out / not yet active</text>
  <line x1="400" y1="900" x2="430" y2="900" stroke="#555" stroke-width="1.5"/>
  <text x="436" y="904" font-size="10" fill="#333">Solid = active traffic path</text>
  <rect x="580" y="893" width="12" height="10" fill="#FFF3E0" stroke="#E65100" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="598" y="904" font-size="10" fill="#BF360C">Orange dashed = gap vs design reference</text>

  <!-- ── ARROWHEAD MARKER ───────────────────────────────────────── -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

</svg>
