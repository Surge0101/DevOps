<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="1100" fill="#F8F9FA"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F4E79">ds-app AWS Architecture — dev environment (ap-southeast-2)</text>

  <!-- ── INTERNET ──────────────────────────────────────────────── -->
  <rect x="490" y="60" width="220" height="50" rx="10" fill="#E8E8E8" stroke="#888" stroke-width="1.5"/>
  <text x="600" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Internet</text>
  <text x="600" y="98" text-anchor="middle" font-size="11" fill="#666">User traffic</text>

  <!-- Arrow: Internet → Route 53 -->
  <line x1="600" y1="110" x2="600" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROUTE 53 ──────────────────────────────────────────────── -->
  <rect x="440" y="145" width="320" height="55" rx="10" fill="#E9D5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="600" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C1D95">Route 53</text>
  <text x="600" y="183" text-anchor="middle" font-size="11" fill="#6D28D9">A Record (Alias): api.dev.ds-shin.com</text>
  <text x="600" y="197" text-anchor="middle" font-size="10" fill="#7C3AED">Hosted Zone: Z03362612XHMJOJC8YK3A  (dev.ds-shin.com)</text>

  <!-- Arrow: Route 53 → ALB -->
  <line x1="600" y1="200" x2="600" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ACM Certificate ──────────────────────────────────────── -->
  <rect x="860" y="155" width="200" height="45" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="960" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#4C1D95">ACM Certificate</text>
  <text x="960" y="191" text-anchor="middle" font-size="10" fill="#6D28D9">*.dev.ds-shin.com  (ISSUED)</text>
  <!-- dashed line: cert → ALB -->
  <line x1="860" y1="178" x2="760" y2="275" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5 3"/>

  <!-- ── VPC OUTER CONTAINER ──────────────────────────────────── -->
  <rect x="60" y="240" width="1080" height="720" rx="18" fill="none" stroke="#2E75B6" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="80" y="262" font-size="12" font-weight="bold" fill="#2E75B6">ds-dev VPC  10.1.0.0/16  |  ap-southeast-2  |  Account: 409749468395</text>

  <!-- ── PUBLIC SUBNETS ───────────────────────────────────────── -->
  <rect x="80" y="270" width="1040" height="155" rx="12" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="100" y="290" font-size="11" font-weight="bold" fill="#2E7D32">Public Subnets  (10.1.0.0/24 - AZ-a  |  10.1.1.0/24 - AZ-b)</text>

  <!-- ALB -->
  <rect x="100" y="300" width="320" height="100" rx="10" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5"/>
  <text x="260" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">Application Load Balancer</text>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#1565C0">dev-ds-app-alb</text>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#1565C0">HTTP :80 (redirect) / HTTPS :443</text>
  <text x="260" y="378" text-anchor="middle" font-size="10" fill="#1976D2">Security Group: dev-alb-sg</text>
  <text x="260" y="393" text-anchor="middle" font-size="10" fill="#1976D2">Internet-facing  |  Public subnets</text>

  <!-- NAT Gateway -->
  <rect x="500" y="300" width="260" height="100" rx="10" fill="#B2DFDB" stroke="#00695C" stroke-width="1.5"/>
  <text x="630" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#004D40">NAT Gateway</text>
  <text x="630" y="342" text-anchor="middle" font-size="11" fill="#00695C">nat-099ef1e9f528c1007</text>
  <text x="630" y="360" text-anchor="middle" font-size="11" fill="#00695C">Elastic IP allocated</text>
  <text x="630" y="378" text-anchor="middle" font-size="10" fill="#00796B">AZ-a (us-east-2a) only</text>
  <text x="630" y="393" text-anchor="middle" font-size="10" fill="#00796B">natGateways: 1 (cost-optimised)</text>

  <!-- Internet Gateway -->
  <rect x="840" y="300" width="250" height="100" rx="10" fill="#C8E6C9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="965" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">Internet Gateway</text>
  <text x="965" y="342" text-anchor="middle" font-size="11" fill="#388E3C">igw-xxx</text>
  <text x="965" y="360" text-anchor="middle" font-size="11" fill="#388E3C">Attached to VPC</text>
  <text x="965" y="378" text-anchor="middle" font-size="10" fill="#43A047">Route: 0.0.0.0/0 → igw</text>
  <text x="965" y="393" text-anchor="middle" font-size="10" fill="#43A047">Public subnets only</text>

  <!-- Arrow: ALB → ECS -->
  <line x1="260" y1="400" x2="260" y2="470" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="440" font-size="10" fill="#1565C0">:8080</text>

  <!-- Arrow: ECS → NAT (outbound) -->
  <line x1="520" y1="540" x2="580" y2="390" stroke="#00695C" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="510" y="460" font-size="10" fill="#00695C">outbound</text>

  <!-- ── PRIVATE APP SUBNETS ───────────────────────────────────── -->
  <rect x="80" y="460" width="1040" height="210" rx="12" fill="#FFF3E0" stroke="#E65100" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="100" y="480" font-size="11" font-weight="bold" fill="#BF360C">PrivateApp Subnets  (10.1.2.0/24 - AZ-a  |  10.1.3.0/24 - AZ-b)  Route: 0.0.0.0/0 → NAT</text>

  <!-- ECS Cluster -->
  <rect x="100" y="490" width="460" height="155" rx="10" fill="#FFE0B2" stroke="#E65100" stroke-width="1.5"/>
  <text x="330" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">ECS Fargate Cluster</text>
  <text x="330" y="530" text-anchor="middle" font-size="11" fill="#E65100">dev-ds-app-cluster  |  Container Insights: ON</text>

  <!-- Fargate Task -->
  <rect x="120" y="540" width="420" height="90" rx="8" fill="#FFCC80" stroke="#F57C00" stroke-width="1.2"/>
  <text x="330" y="560" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Fargate Task  (dev-ds-app-service)</text>
  <text x="330" y="578" text-anchor="middle" font-size="11" fill="#F57C00">Spring Boot 3.5.12  |  Java 21  |  Port 8080</text>
  <text x="330" y="596" text-anchor="middle" font-size="10" fill="#F57C00">CPU: 256  |  Memory: 512 MB  |  Image: dev-ds-app:latest (ECR)</text>
  <text x="330" y="612" text-anchor="middle" font-size="10" fill="#F57C00">Security Group: dev-ecs-sg  |  assignPublicIp: false</text>
  <text x="330" y="626" text-anchor="middle" font-size="10" fill="#F57C00">healthCheckGracePeriod: 120s  |  Auto Scaling: 1-4 tasks</text>

  <!-- VPC Endpoints -->
  <rect x="600" y="490" width="490" height="155" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="845" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">VPC Interface Endpoints</text>
  <text x="845" y="530" text-anchor="middle" font-size="11" fill="#2E7D32">Private connectivity to AWS services (no NAT needed)</text>

  <rect x="620" y="540" width="130" height="40" rx="6" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="685" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">ECR API</text>
  <text x="685" y="573" text-anchor="middle" font-size="10" fill="#2E7D32">Image auth</text>

  <rect x="760" y="540" width="130" height="40" rx="6" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="825" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">ECR Docker</text>
  <text x="825" y="573" text-anchor="middle" font-size="10" fill="#2E7D32">Image pull</text>

  <rect x="900" y="540" width="170" height="40" rx="6" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="985" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">CloudWatch Logs</text>
  <text x="985" y="573" text-anchor="middle" font-size="10" fill="#2E7D32">Log streaming</text>

  <rect x="620" y="590" width="170" height="40" rx="6" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="705" y="607" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">Secrets Manager</text>
  <text x="705" y="623" text-anchor="middle" font-size="10" fill="#2E7D32">DB credentials</text>

  <rect x="800" y="590" width="130" height="40" rx="6" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="865" y="607" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">S3 Gateway</text>
  <text x="865" y="623" text-anchor="middle" font-size="10" fill="#2E7D32">ECR layers (free)</text>

  <!-- Arrow: ECS → RDS -->
  <line x1="260" y1="630" x2="260" y2="710" stroke="#E65100" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="672" font-size="10" fill="#E65100">:5432</text>

  <!-- ── PRIVATE DATA SUBNETS ──────────────────────────────────── -->
  <rect x="80" y="700" width="1040" height="230" rx="12" fill="#FCE4EC" stroke="#880E4F" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="100" y="720" font-size="11" font-weight="bold" fill="#880E4F">PrivateData Subnets  (10.1.4.0/24 - AZ-a  |  10.1.5.0/24 - AZ-b)  No internet route</text>

  <!-- RDS Primary -->
  <rect x="100" y="730" width="320" height="170" rx="10" fill="#F8BBD0" stroke="#C2185B" stroke-width="1.5"/>
  <text x="260" y="752" text-anchor="middle" font-size="13" font-weight="bold" fill="#880E4F">RDS PostgreSQL Primary</text>
  <text x="260" y="770" text-anchor="middle" font-size="11" fill="#C2185B">dev-ds-app-db</text>
  <text x="260" y="788" text-anchor="middle" font-size="11" fill="#C2185B">PostgreSQL 16.13  |  db.t4g.micro</text>
  <text x="260" y="806" text-anchor="middle" font-size="10" fill="#AD1457">Multi-AZ: false  |  Storage: 20 GB gp2</text>
  <text x="260" y="822" text-anchor="middle" font-size="10" fill="#AD1457">Max storage: 100 GB (autoscale)</text>
  <text x="260" y="838" text-anchor="middle" font-size="10" fill="#AD1457">Backup retention: 1 day</text>
  <text x="260" y="854" text-anchor="middle" font-size="10" fill="#AD1457">Security Group: dev-rds-sg</text>
  <text x="260" y="870" text-anchor="middle" font-size="10" fill="#AD1457">Encrypted: KMS CMK  |  DB: dsapp</text>
  <text x="260" y="886" text-anchor="middle" font-size="10" fill="#AD1457">Creds: Secrets Manager</text>

  <!-- RDS Snapshot -->
  <rect x="460" y="730" width="220" height="110" rx="10" fill="#F48FB1" stroke="#C2185B" stroke-width="1.2"/>
  <text x="570" y="752" text-anchor="middle" font-size="12" font-weight="bold" fill="#880E4F">Manual Snapshot</text>
  <text x="570" y="770" text-anchor="middle" font-size="11" fill="#C2185B">dev-ds-app-db-initial</text>
  <text x="570" y="788" text-anchor="middle" font-size="10" fill="#AD1457">Created on deploy</text>
  <text x="570" y="804" text-anchor="middle" font-size="10" fill="#AD1457">20 GB  |  Persists after destroy</text>
  <text x="570" y="820" text-anchor="middle" font-size="10" fill="#AD1457">~$0.095/GB/month</text>

  <!-- KMS Key -->
