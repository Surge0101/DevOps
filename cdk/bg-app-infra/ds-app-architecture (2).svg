  <text x="102" y="914" font-size="10" fill="#333">Networking / Load Balancing</text>
  <rect x="260" y="905" width="16" height="10" fill="#FFE0B2" stroke="#E65100" stroke-width="1"/>
  <text x="282" y="914" font-size="10" fill="#333">Compute (ECS)</text>
  <rect x="400" y="905" width="16" height="10" fill="#F8BBD0" stroke="#C2185B" stroke-width="1"/>
  <text x="422" y="914" font-size="10" fill="#333">Database (RDS)</text>
  <rect x="530" y="905" width="16" height="10" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="1"/>
  <text x="552" y="914" font-size="10" fill="#333">Security (KMS / Secrets)</text>
  <rect x="700" y="905" width="16" height="10" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="722" y="914" font-size="10" fill="#333">VPC Endpoints</text>
  <rect x="830" y="905" width="16" height="10" fill="#E8EAF6" stroke="#3949AB" stroke-width="1"/>
  <text x="852" y="914" font-size="10" fill="#333">CI/CD</text>
  <rect x="930" y="905" width="16" height="10" fill="#E9D5FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="952" y="914" font-size="10" fill="#333">DNS / Certificate</text>

  <!-- dashed = optional / outbound flow -->
  <line x1="80" y1="930" x2="110" y2="930" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="116" y="934" font-size="10" fill="#333">Dashed = outbound / async flow</text>
  <line x1="300" y1="930" x2="330" y2="930" stroke="#555" stroke-width="1.5"/>
  <text x="336" y="934" font-size="10" fill="#333">Solid = primary traffic path</text>
</svg>
