  <text x="810" y="770" text-anchor="middle" font-size="11" fill="#6A1B9A">dev-rds-key</text>
  <text x="810" y="788" text-anchor="middle" font-size="10" fill="#7B1FA2">Rotation: enabled</text>
  <text x="810" y="804" text-anchor="middle" font-size="10" fill="#7B1FA2">Encrypts RDS storage</text>
  <text x="810" y="820" text-anchor="middle" font-size="10" fill="#7B1FA2">and Secrets Manager</text>

  <!-- Secrets Manager -->
  <rect x="940" y="730" width="160" height="110" rx="10" fill="#D1C4E9" stroke="#4527A0" stroke-width="1.2"/>
  <text x="1020" y="752" text-anchor="middle" font-size="12" font-weight="bold" fill="#311B92">Secrets Manager</text>
  <text x="1020" y="770" text-anchor="middle" font-size="10" fill="#4527A0">dev/ds-app/</text>
  <text x="1020" y="786" text-anchor="middle" font-size="10" fill="#4527A0">db-credentials</text>
  <text x="1020" y="802" text-anchor="middle" font-size="10" fill="#4527A0">username: dsadmin</text>
  <text x="1020" y="818" text-anchor="middle" font-size="10" fill="#4527A0">password: auto-generated</text>
  <text x="1020" y="834" text-anchor="middle" font-size="10" fill="#4527A0">host / port / dbname</text>

  <!-- Arrow: RDS → Snapshot -->
  <line x1="420" y1="790" x2="460" y2="790" stroke="#C2185B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ── CI/CD SECTION ─────────────────────────────────────────── -->
  <rect x="60" y="955" width="1080" height="115" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="975" font-size="11" font-weight="bold" fill="#0D47A1">CI/CD Pipeline  (outside VPC)</text>

  <!-- GitHub -->
  <rect x="90" y="985" width="140" height="70" rx="8" fill="#E8EAF6" stroke="#3949AB" stroke-width="1.2"/>
  <text x="160" y="1007" text-anchor="middle" font-size="12" font-weight="bold" fill="#283593">GitHub</text>
  <text x="160" y="1025" text-anchor="middle" font-size="10" fill="#3949AB">GermanShin/DevOps</text>
  <text x="160" y="1041" text-anchor="middle" font-size="10" fill="#3949AB">app/ds-hello-service</text>
  <text x="160" y="1057" text-anchor="middle" font-size="10" fill="#3949AB">branch: main</text>

  <!-- Arrow: GitHub → CodePipeline -->
  <line x1="230" y1="1020" x2="270" y2="1020" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="250" y="1013" text-anchor="middle" font-size="9" fill="#1565C0">push</text>

  <!-- CodePipeline -->
  <rect x="270" y="985" width="180" height="70" rx="8" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.2"/>
  <text x="360" y="1007" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D47A1">CodePipeline</text>
  <text x="360" y="1025" text-anchor="middle" font-size="10" fill="#1565C0">dev-ds-app-pipeline</text>
  <text x="360" y="1041" text-anchor="middle" font-size="10" fill="#1565C0">Source → Build → Deploy</text>
  <text x="360" y="1057" text-anchor="middle" font-size="10" fill="#1565C0">Timeout: 20 min</text>

  <!-- Arrow: CodePipeline → CodeBuild -->
  <line x1="450" y1="1020" x2="490" y2="1020" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CodeBuild -->
  <rect x="490" y="985" width="200" height="70" rx="8" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.2"/>
  <text x="590" y="1007" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D47A1">CodeBuild</text>
  <text x="590" y="1025" text-anchor="middle" font-size="10" fill="#1565C0">dev-ds-app-build</text>
  <text x="590" y="1041" text-anchor="middle" font-size="10" fill="#1565C0">LinuxBuildImage.STANDARD_7_0</text>
  <text x="590" y="1057" text-anchor="middle" font-size="10" fill="#1565C0">Gradle test + Docker build (AMD64)</text>

  <!-- Arrow: CodeBuild → ECR -->
  <line x1="690" y1="1020" x2="730" y2="1020" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="710" y="1013" text-anchor="middle" font-size="9" fill="#1565C0">push</text>

  <!-- ECR -->
  <rect x="730" y="985" width="180" height="70" rx="8" fill="#B2DFDB" stroke="#00695C" stroke-width="1.2"/>
  <text x="820" y="1007" text-anchor="middle" font-size="12" font-weight="bold" fill="#004D40">ECR</text>
  <text x="820" y="1025" text-anchor="middle" font-size="10" fill="#00695C">dev-ds-app</text>
  <text x="820" y="1041" text-anchor="middle" font-size="10" fill="#00695C">imageScanOnPush: true</text>
  <text x="820" y="1057" text-anchor="middle" font-size="10" fill="#00695C">Keep last 10 images</text>

  <!-- Arrow: ECR → CodePipeline Deploy → ECS -->
  <line x1="910" y1="1020" x2="960" y2="1020" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- ECS Deploy action -->
  <rect x="960" y="985" width="160" height="70" rx="8" fill="#BBDEFB" stroke="#1565C0" stroke-width="1.2"/>
  <text x="1040" y="1007" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D47A1">ECS Deploy</text>
  <text x="1040" y="1025" text-anchor="middle" font-size="10" fill="#1565C0">Rolling update</text>
  <text x="1040" y="1041" text-anchor="middle" font-size="10" fill="#1565C0">imagedefinitions.json</text>
  <text x="1040" y="1057" text-anchor="middle" font-size="10" fill="#1565C0">→ dev-ds-app-service</text>

  <!-- Arrow: ECS Deploy → Fargate (curved up) -->
  <path d="M1040 985 Q1040 920 330 630" fill="none" stroke="#1565C0" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <!-- ── ARROWHEAD MARKER ───────────────────────────────────────── -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── LEGEND ─────────────────────────────────────────────────── -->
